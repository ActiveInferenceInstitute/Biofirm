# AII sidecar — InstituteOS metadata. Schema: aii_platform.aii_sidecar
meta:
  sidecar_version: 1.2.1
  updated: '2026-11-12'
repo:
  name: Biofirm
  slug: biofirm
  full_name: ActiveInferenceInstitute/Biofirm
  description: Installable Python package for reproducible ecological control, bioregion
    research, deterministic text extraction, analysis, and auditable business planning
    with a pymdp active-inference controller.
institute:
  category: research-software
  status: active
  maturity: released
  steward: Active Inference Institute
ecosystem:
  relations:
  - repo: ActiveInferenceInstitute/InstituteOS
    relation: referenced-by
    note: Federated via the InstituteOS .aii manifest.
  - repo: ActiveInferenceInstitute/Active_Inference_Ontology
    relation: references
    note: Uses Active Inference Ontology terms.
  - repo: ActiveInferenceInstitute/pymdp
    relation: depends-on
    note: Consumes the pymdp active-inference library.
  - repo: ActiveInferenceInstitute/Generalized_Notation_Notation
    relation: references
    note: Uses Generalized Notation Notation (GNN) for model specifications.
  links:
    github: https://github.com/ActiveInferenceInstitute/Biofirm
    website: https://www.activeinference.org
artifacts:
- path: README.md
  kind: doc
  description: Repository overview.
- path: AGENTS.md
  kind: doc
  description: Agent guidance.
- path: LICENSE
  kind: doc
  description: License.
- path: CITATION.cff
  kind: citation
  description: Machine-readable citation metadata.
- path: docs
  kind: doc
  description: Modular documentation hub (configuration, I/O, GNN).
- path: docs/documentation-index.md
  kind: doc
  description: Repository-wide documentation index.
- path: CONFIGURATION.md
  kind: doc
  description: Field-by-field configuration reference.
- path: models
  kind: doc
  description: GNN model specification and pinned upstream revision.
- path: Documentation
  kind: doc
  description: Package walkthrough notebook.
- path: tools
  kind: code
  description: Repository verification gate.
- path: pyproject.toml
  kind: code
  description: Python package configuration.
- path: src
  kind: code
  description: Source tree.
- path: tests
  kind: test
  description: Test suite.
- path: One_Earth
  kind: dataset
  description: Authoritative One Earth bioregion source data.
- path: Bio_Perplexity
  kind: dataset
  description: Authoritative regional source maps and research prompts.
