name: biofirm-ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked tooling and dependencies
        run: |
          python -m pip install --upgrade pip uv==0.11.6
          uv lock --check
          uv export --all-extras --format requirements.txt --locked --no-emit-project --no-header --output-file "$RUNNER_TEMP/requirements.lock"
          diff -u requirements.lock "$RUNNER_TEMP/requirements.lock"
          uv sync --frozen --all-extras
      - name: Test suite
        run: uv run pytest --cov=biofirm --cov-report=term-missing --cov-fail-under=90
      - name: Ruff
        run: uv run ruff check src tests tools && uv run ruff format --check src tests tools
      - name: Mypy
        run: uv run mypy --python-version 3.12 src/biofirm
      - name: Bandit
        run: uv run bandit -q -r src tools
      - name: Syntax and import scan
        run: uv run python tools/verify_repository.py
      - name: Documentation command
        run: |
          uv run biofirm validate
          uv run biofirm validate-data
      - name: Build wheel
        run: uv run python -m build
      - name: Install and run outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/biofirm-clean"
          uv pip install --python "$RUNNER_TEMP/biofirm-clean/bin/python" --requirement requirements.lock
          uv pip install --python "$RUNNER_TEMP/biofirm-clean/bin/python" --no-deps dist/*.whl
          "$RUNNER_TEMP/biofirm-clean/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          root.joinpath("description.txt").write_text("A river supports biodiversity between 40 and 80 index.", encoding="utf-8")
          root.joinpath("state.json").write_text(json.dumps({"biodiversity": 40, "soil_moisture": 40, "water_quality": 40}), encoding="utf-8")
          PY
          cd "$RUNNER_TEMP"
          BIN="$RUNNER_TEMP/biofirm-clean/bin/biofirm"
          "$BIN" validate
          "$BIN" simulate --steps 2 --controller slide-rule --output run.json
          "$BIN" sweep --steps 1 --seeds 1 2 --controller random --output sweep.json
          "$BIN" analyze --input run.json --output analysis.json
          "$BIN" visualize --input run.json --output run.png
          "$BIN" parse-description --input description.txt --output profile.json
          "$BIN" business-evaluate --state state.json
          test -s run.json
          test -s sweep.json
          test -s analysis.json
          test -s run.png
          test -s profile.json
      - name: Secret scan
        shell: bash
        run: |
          scanner="$RUNNER_TEMP/biofirm-gitleaks"
          mkdir -p "$scanner"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner/release.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner/release.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner/release.tar.gz" -C "$scanner" gitleaks
          test "$("$scanner/gitleaks" version)" = 8.30.1
          control="$(mktemp -d "$RUNNER_TEMP/biofirm-secret-control.XXXXXX")"
          python - "$control/control.txt" <<'PYCONTROL'
          from pathlib import Path
          import secrets
          import string
          import sys
          synthetic = "ghp_" + "".join(secrets.choice(string.ascii_letters + string.digits) for _ in range(36))
          Path(sys.argv[1]).write_text('token = "' + synthetic + '"\n', encoding="utf-8")
          PYCONTROL
          if "$scanner/gitleaks" dir --redact --no-banner --exit-code 1 "$control"; then
            echo "Secret scanner failed to reject the synthetic control" >&2
            exit 1
          else
            test "$?" = 1
          fi
          "$scanner/gitleaks" git --redact --no-banner --exit-code 1 --log-opts=--all .
