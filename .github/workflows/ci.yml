name: biofirm-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every step below is an arm of `run.sh`, so CI and a local run execute the
# same commands. The lint, type, documentation, build, install and secret arms
# are interpreter-independent and run once on 3.12; only the test suite is
# duplicated across the supported Python versions.

jobs:
  quality:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BIOFIRM_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448 # pinned composite action
        with:
          python-version: "3.12"
      - name: Lock the environment
        run: ./run.sh sync
      - name: Dependency lock
        run: ./run.sh deps
      - name: Lint
        run: ./run.sh lint
      - name: Types
        run: ./run.sh types
      - name: Documentation links and repository contract
        run: ./run.sh links
      - name: Documentation commands
        run: ./run.sh docs
      - name: Gate document
        run: ./run.sh gate
      - name: Bandit
        run: ./run.sh bandit
      - name: Build wheel
        run: ./run.sh build
      - name: Install and run outside checkout
        run: ./run.sh install
      - name: Secret scan
        run: ./run.sh secret

  tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      BIOFIRM_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448 # pinned composite action
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lock the environment
        run: ./run.sh sync
      - name: Test suite
        run: ./run.sh test

  gnn-conformance:
    timeout-minutes: 30
    # Validates models/biofirm_ecosystem_variable.gnn.md with the upstream parser
    # revision pinned in .github/gnn-pin.json. The pin is fetched from the public
    # repository at the recorded SHA into its own runtime; tests/test_gnn.py
    # fails (never skips) when the explicitly selected checkout is missing or
    # unusable, so the pin is checked here rather than assumed. The arm also
    # writes the resolved parser version to the job summary.
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    env:
      BIOFIRM_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448 # pinned composite action
        with:
          python-version: "3.12"
      - name: Lock the environment
        run: ./run.sh sync
      - name: Pinned parser conformance
        run: ./run.sh gnn
