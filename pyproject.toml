[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "biofirm"
version = "0.1.0"
description = "Reproducible ecological control, bioregion research, and decision analysis."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Active Inference Institute" }]
dependencies = [
  "numpy==2.2.6",
  "requests==2.32.4",
  "inferactively-pymdp==1.0.3",
  "jax==0.8.0",
]

[project.optional-dependencies]
analysis = ["pandas>=2.0,<3", "scipy>=1.10,<2"]
visualization = [
  "matplotlib>=3.7,<4",
  "scikit-learn>=1.3,<2",
  "seaborn>=0.12,<1",
  "networkx>=3.1,<4",
  "wordcloud>=1.9,<2",
]
documents = ["pdfplumber>=0.11,<1", "tiktoken>=0.7,<1"]
dev = [
  "build>=1.2,<2",
  "bandit>=1.7,<2",
  "mypy>=1.11,<3",
  "nbformat>=5.10,<6",
  "pytest>=8.0,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "types-requests>=2.31,<3",
]
all = [
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "matplotlib>=3.7,<4",
  "scikit-learn>=1.3,<2",
  "seaborn>=0.12,<1",
  "networkx>=3.1,<4",
  "wordcloud>=1.9,<2",
  "pdfplumber>=0.11,<1",
  "tiktoken>=0.7,<1",
]

[project.scripts]
biofirm = "biofirm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biofirm"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/biofirm"]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["requests.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.bandit]
exclude_dirs = ["tests", "Documentation/Notebooks"]
